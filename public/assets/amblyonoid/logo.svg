<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img" aria-label="Amblyonoid">
  <rect width="320" height="180" fill="none"/>
  <g>
    <!-- bricks, alternating cyan / red -->
    <g>
      <rect x="40"  y="34" width="34" height="16" rx="3" fill="#00ffff"/>
      <rect x="78"  y="34" width="34" height="16" rx="3" fill="#ff0000"/>
      <rect x="116" y="34" width="34" height="16" rx="3" fill="#00ffff"/>
      <rect x="154" y="34" width="34" height="16" rx="3" fill="#ff0000"/>
      <rect x="192" y="34" width="34" height="16" rx="3" fill="#00ffff"/>
      <rect x="230" y="34" width="34" height="16" rx="3" fill="#ff0000"/>
      <rect x="40"  y="54" width="34" height="16" rx="3" fill="#ff0000"/>
      <rect x="78"  y="54" width="34" height="16" rx="3" fill="#00ffff"/>
      <rect x="116" y="54" width="34" height="16" rx="3" fill="#ff0000"/>
      <rect x="154" y="54" width="34" height="16" rx="3" fill="#00ffff"/>
      <rect x="192" y="54" width="34" height="16" rx="3" fill="#ff0000"/>
      <rect x="230" y="54" width="34" height="16" rx="3" fill="#00ffff"/>
    </g>
    <!-- ball -->
    <circle cx="170" cy="112" r="8" fill="#cfcfcf"/>
    <!-- paddle -->
    <rect x="128" y="140" width="80" height="14" rx="7" fill="#9a9a9a"/>
  </g>
  <text x="160" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="18" fill="#e8e8f0" letter-spacing="2">AMBLYONOID</text>
</svg>
