<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img" aria-label="Flying Bird">
  <rect width="320" height="180" fill="none"/>
  <g>
    <!-- pipe pair: top bar one eye, bottom bar the other -->
    <rect x="210" y="0"   width="26" height="70"  fill="#000080"/>
    <rect x="210" y="118" width="26" height="62"  fill="#800000"/>
    <!-- bird -->
    <circle cx="100" cy="94" r="16" fill="#cfcfcf"/>
  </g>
  <text x="160" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="18" fill="#e8e8f0" letter-spacing="2">FLYING BIRD</text>
</svg>
