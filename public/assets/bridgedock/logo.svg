<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img" aria-label="Bridge Dock">
  <rect width="320" height="180" fill="none"/>
  <g>
    <!-- falling rectangles, navy / maroon -->
    <rect x="50" y="30" width="46" height="14" rx="2" fill="#000080"/>
    <rect x="150" y="46" width="40" height="14" rx="2" fill="#800000"/>
    <rect x="220" y="28" width="50" height="14" rx="2" fill="#000080"/>
    <rect x="90" y="70" width="42" height="14" rx="2" fill="#800000"/>
    <rect x="200" y="80" width="46" height="14" rx="2" fill="#000080"/>
    <!-- dodging ball -->
    <circle cx="160" cy="128" r="16" fill="#cfcfcf"/>
  </g>
  <text x="160" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="16" fill="#e8e8f0" letter-spacing="1.5">BRIDGE DOCK</text>
</svg>
