name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          # Skips Puppeteer's Chromium download — this job never launches a
          # browser, that's the e2e-test job's whole job (see below).
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run: npm run build
      - run: npm test

  e2e-test:
    name: E2E (Puppeteer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e

  deploy-prod:
    name: Deploy production (mi-ojo-vago.guidev.org)
    needs: [build-and-test, e2e-test]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-deploy-prod
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          # Skips Puppeteer's Chromium download — this job never launches a
          # browser, that's the e2e-test job's whole job (see below).
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run: npm run build
      - name: wrangler deploy (prod)
        run: npx wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  preview-pr:
    name: Upload PR preview (per-PR URL)
    needs: [build-and-test, e2e-test]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    # Scoped to one PR. The old shared group meant two open PRs raced for the
    # same deployment and whichever finished last owned the dev URL.
    concurrency:
      group: cloudflare-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          # Skips Puppeteer's Chromium download — this job never launches a
          # browser, that's the e2e-test job's whole job (see below).
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run: npm run build
      - name: Ensure preview URLs are enabled
        # Preview URLs live on the Worker's workers.dev subdomain, which is off
        # because this Worker is served from a custom domain -- and `versions
        # upload` will not turn it on. Idempotent, so it just re-asserts the
        # setting on every run. `enabled: false` keeps the stable workers.dev
        # hostname off; only the per-version preview hostnames are wanted.
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT"
          subdomain=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" \
            "$api/workers/subdomain" | jq -r '.result.subdomain // empty')
          if [ -z "$subdomain" ]; then
            echo "::error::This account has no workers.dev subdomain, so preview URLs cannot exist. Register one under Workers & Pages -> Subdomain in the Cloudflare dashboard."
            exit 1
          fi
          echo "account subdomain: $subdomain"
          curl -sS -X POST -H "Authorization: Bearer $CF_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"enabled":false,"previews_enabled":true}' \
            "$api/workers/scripts/mi-ojo-vago-dev/subdomain" | jq -e '.success'
      - name: wrangler versions upload (preview)
        id: upload
        # Uploads a version without promoting it: the version gets its own
        # preview URL, and mi-ojo-vago-dev.guidev.org keeps serving whatever
        # was last deployed there.
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler versions upload --config wrangler.dev.jsonc \
            --message "PR #${PR_NUMBER}: ${PR_TITLE}" \
            --tag "pr-${PR_NUMBER}" | tee upload.log
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' upload.log | tail -1)
          if [ -z "$url" ]; then
            echo "::error::wrangler printed no preview URL - are preview URLs enabled for this Worker?"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Passed as env rather than interpolated into the script: a PR title
          # is arbitrary text and would otherwise be evaluated as shell.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
      - name: Comment the preview URL
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          URL: ${{ steps.upload.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          body=$(cat <<EOF
          <!-- cf-preview -->
          **Preview:** $URL

          Built from \`${SHA:0:7}\`. This URL belongs to this PR alone;
          mi-ojo-vago-dev.guidev.org is untouched (run the workflow manually to
          put a branch there).
          EOF
          )
          # One comment per PR, edited in place, so a PR with many pushes does
          # not accumulate a stack of near-identical bot comments.
          # --paginate runs the filter once per page, so trim to the first hit.
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
                 --jq '.[] | select(.body | startswith("<!-- cf-preview -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" --silent
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" --silent
          fi

  deploy-dev:
    name: Deploy dev (mi-ojo-vago-dev.guidev.org)
    needs: [build-and-test, e2e-test]
    # Manual only. Pull requests get their own preview URLs above, so putting a
    # branch on the shared dev domain is now a deliberate act.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-deploy-dev
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          # Skips Puppeteer's Chromium download — this job never launches a
          # browser, that's the e2e-test job's whole job (see below).
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run: npm run build
      - name: wrangler deploy (dev)
        run: npx wrangler deploy --config wrangler.dev.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-hosting-stg:
    name: Deploy staging (dresiribarren.com.ar/mi-ojo-vago_stg)
    needs: [build-and-test, e2e-test]
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: cpanel-deploy-stg
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          # Skips Puppeteer's Chromium download — this job never launches a
          # browser, that's the e2e-test job's whole job (see below).
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run: npm run build
        env:
          # Served from a subdirectory, so assets and the sync endpoint are
          # resolved against this prefix rather than the domain root.
          VITE_BASE: /mi-ojo-vago_stg/
          VITE_SYNC_URL: /mi-ojo-vago_stg
      - name: Mark staging noindex
        # Staging only — public/.htaccess stays environment-agnostic so the same
        # file can ship to production untouched.
        run: |
          cat >> dist/.htaccess <<'HTACCESS'

          <IfModule mod_headers.c>
            Header set X-Robots-Tag "noindex, nofollow"
          </IfModule>
          HTACCESS
      - name: FTPS upload to cPanel
        # Pinned to a commit SHA, not a tag: this is a third-party action and it
        # receives the cPanel FTP credentials, so a moved tag would hand them over.
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_FTP_USER }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          # The FTP account is chrooted to mi-ojo-vago-app/, outside public_html —
          # shared with deploy-hosting-prod below, one directory per environment.
          server-dir: ./stg/html/

  deploy-hosting-prod:
    name: Deploy production (dresiribarren.com.ar/mi-ojo-vago)
    needs: [build-and-test, e2e-test]
    # Same trigger as deploy-prod (Cloudflare) below. Dormant for now: nothing
    # in public_html/.htaccess points at prod/html/ yet (that rewrite ships
    # commented out until the cutover), so this job uploads to a directory no
    # URL can reach — safe to run from day one.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: cpanel-deploy-prod
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          # Skips Puppeteer's Chromium download — this job never launches a
          # browser, that's the e2e-test job's whole job (see below).
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run: npm run build
        env:
          VITE_BASE: /mi-ojo-vago/
          VITE_SYNC_URL: /mi-ojo-vago
          VITE_DONATION_EMAIL: ${{ vars.VITE_DONATION_EMAIL }}
          VITE_DONATION_PHONE: ${{ vars.VITE_DONATION_PHONE }}
      - name: FTPS upload to cPanel
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_FTP_USER }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./prod/html/
